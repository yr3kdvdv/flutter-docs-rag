[project]
name = "flutter-rag"
version = "0.1.0"
description = "RAG over the official Flutter documentation (lab 1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6,<7",
    "httpx>=0.28,<1",
    "tenacity>=8.2.3,<10",
    "google-genai>=2.33,<3",
    "voyageai>=0.5,<1",
    "qdrant-client>=1.20,<2",
    "langfuse>=5.0,<6",
    "fastapi>=0.161,<1",
    "uvicorn>=0.54,<1",
]

[project.scripts]
flutter-rag = "flutter_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flutter_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
