name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lab1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (no network, no secrets)
        run: uv run pytest
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-header --no-hashes --no-dev --no-emit-project -q -o "$RUNNER_TEMP/req.txt"
          diff -u requirements.txt "$RUNNER_TEMP/req.txt"
